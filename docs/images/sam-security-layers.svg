<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Security Automation Manager layered security model</title>
  <desc id="desc">Six nested layers show governance and operations, controlled automation, continuous intelligence, browser security policy, transport and certificate trust, and the protected WordPress site.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#656565"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#222222" flood-opacity="0.28"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#222222" flood-opacity="0.22"/>
    </filter>
    <style>
      .type { font-family: Overpass, Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 500; letter-spacing: 3.2px; }
      .title { font-size: 48px; font-weight: 500; letter-spacing: -1px; }
      .subtitle { font-size: 20px; font-weight: 300; }
      .layer-number { font-size: 15px; font-weight: 600; letter-spacing: 1.8px; }
      .layer-title { font-size: 24px; font-weight: 500; }
      .layer-detail { font-size: 16px; font-weight: 300; }
      .pill { font-size: 14px; font-weight: 500; }
      .core-title { font-size: 30px; font-weight: 600; }
      .core-subtitle { font-size: 17px; font-weight: 400; }
      .footer { font-size: 14px; font-weight: 300; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <path d="M0 0H1600V7H0Z" fill="#ffffff" opacity="0.9"/>

  <!-- Header -->
  <g class="type" fill="#ffffff">
    <g transform="translate(80 58)">
      <path d="M0 18h34c9 0 15-5 15-12 0-7-6-12-14-12-2 0-4 0-6 1C26-12 20-16 12-16 2-16-5-9-6 0-13 1-18 6-18 12c0 8 7 14 18 14h34" transform="translate(18 16) scale(.72)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="62" y="8" class="eyebrow">VCNS TECH LTD</text>
    </g>
    <text x="80" y="135" class="title">Security Automation Manager</text>
    <text x="80" y="172" class="subtitle" fill="#e5e7eb">A defence-in-depth control model for WordPress</text>
  </g>

  <!-- Layer 01 -->
  <g>
    <rect x="80" y="220" width="1440" height="690" rx="24" fill="#3f3f3f" stroke="#ffffff" stroke-opacity="0.72" stroke-width="2"/>
  </g>
  <g class="type" fill="#ffffff">
    <text x="112" y="257" class="layer-number" fill="#d1d5db">LAYER 01</text>
    <text x="222" y="258" class="layer-title">Governance &amp; operations</text>
    <text x="574" y="258" class="layer-detail" fill="#d1d5db">Audit evidence  ·  capability controls  ·  diagnostics  ·  controlled updates</text>
  </g>

  <!-- Layer 02 -->
  <g>
    <rect x="120" y="285" width="1360" height="585" rx="22" fill="#494949" stroke="#ffffff" stroke-opacity="0.56" stroke-width="2"/>
  </g>
  <g class="type" fill="#ffffff">
    <text x="152" y="322" class="layer-number" fill="#d1d5db">LAYER 02</text>
    <text x="262" y="323" class="layer-title">Controlled automation</text>
    <text x="611" y="323" class="layer-detail" fill="#d1d5db">Manual  ·  assisted  ·  fully automatic  ·  safe fallback</text>
  </g>

  <!-- Layer 03 -->
  <g>
    <rect x="160" y="350" width="1280" height="480" rx="20" fill="#535353" stroke="#ffffff" stroke-opacity="0.47" stroke-width="2"/>
  </g>
  <g class="type" fill="#ffffff">
    <text x="192" y="387" class="layer-number" fill="#d1d5db">LAYER 03</text>
    <text x="302" y="388" class="layer-title">Continuous intelligence</text>
    <text x="668" y="388" class="layer-detail" fill="#e5e7eb">Discovery  ·  evidence  ·  change detection  ·  recommendations</text>
  </g>

  <!-- Layer 04 -->
  <g>
    <rect x="200" y="415" width="1200" height="375" rx="18" fill="#5d5d5d" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
  </g>
  <g class="type" fill="#ffffff">
    <text x="232" y="452" class="layer-number" fill="#e5e7eb">LAYER 04</text>
    <text x="342" y="453" class="layer-title">Browser security policy</text>
    <text x="692" y="453" class="layer-detail" fill="#f3f4f6">CSP  ·  COOP / COEP  ·  framing  ·  MIME  ·  referrer  ·  permissions</text>
  </g>

  <!-- Layer 05 -->
  <g>
    <rect x="240" y="480" width="1120" height="270" rx="16" fill="#686868" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <g class="type" fill="#ffffff">
    <text x="272" y="517" class="layer-number" fill="#f3f4f6">LAYER 05</text>
    <text x="382" y="518" class="layer-title">Transport &amp; certificate trust</text>
    <text x="790" y="518" class="layer-detail" fill="#ffffff">HTTPS  ·  HSTS  ·  certificates  ·  capability checks</text>
  </g>

  <!-- Protected core -->
  <g>
    <rect x="330" y="552" width="940" height="158" rx="18" fill="#f4f4f4" stroke="#ffffff" stroke-width="2"/>
  </g>
  <g transform="translate(378 588)">
    <path d="M42 0 80 14v29c0 31-16 54-38 65C20 97 4 74 4 43V14L42 0Z" fill="#555555"/>
    <path d="M25 51 36 62 60 36" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="type" fill="#4a4a4a">
    <text x="500" y="612" class="eyebrow">PROTECTED CORE</text>
    <text x="500" y="655" class="core-title">WordPress site &amp; security policy</text>
    <text x="500" y="687" class="core-subtitle" fill="#636363">Persistent protection remains in place while SAM observes, decides, enforces and verifies.</text>
  </g>

  <!-- Operating cycle -->
  <g class="type" transform="translate(970 115)">
    <text x="0" y="0" class="eyebrow" fill="#e5e7eb">OPERATING CYCLE</text>
    <g transform="translate(0 18)">
      <rect width="104" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
      <text x="52" y="22" text-anchor="middle" class="pill" fill="#ffffff">Observe</text>
      <path d="M112 17h20" stroke="#e5e7eb" stroke-width="1.5"/>
      <path d="m128 12 6 5-6 5" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
      <rect x="142" width="104" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
      <text x="194" y="22" text-anchor="middle" class="pill" fill="#ffffff">Decide</text>
      <path d="M254 17h20" stroke="#e5e7eb" stroke-width="1.5"/>
      <path d="m270 12 6 5-6 5" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
      <rect x="284" width="104" height="34" rx="17" fill="none" stroke="#ffffff" stroke-opacity="0.7"/>
      <text x="336" y="22" text-anchor="middle" class="pill" fill="#ffffff">Enforce</text>
      <path d="M396 17h20" stroke="#e5e7eb" stroke-width="1.5"/>
      <path d="m412 12 6 5-6 5" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
      <rect x="426" width="104" height="34" rx="17" fill="#ffffff"/>
      <text x="478" y="22" text-anchor="middle" class="pill" fill="#4a4a4a">Verify</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="80" y1="950" x2="1520" y2="950" stroke="#ffffff" stroke-opacity="0.28"/>
  <g class="type" fill="#e5e7eb">
    <text x="80" y="978" class="footer">SECURITY AUTOMATION MANAGER  ·  DEFENCE IN DEPTH</text>
    <text x="1520" y="978" text-anchor="end" class="footer">vcns.tech</text>
  </g>
</svg>
