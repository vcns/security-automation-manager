name: Development Build

# Publishes a rolling, clearly-marked pre-release ("development-latest",
# always overwritten) containing the same GitHub-channel ZIP a real
# release ships, built from whatever just landed on development -- so
# anyone can grab a stable, bookmarkable download of "development" for
# manual testing without hunting through Actions run artifacts or
# waiting on a numbered release. The full PHPUnit/phpcs/SAST/secret-scan
# matrix already runs independently against this exact commit via
# ci.yml's own push trigger; this workflow only builds and publishes,
# it does not re-verify.

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish development-latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install packaging tools
        # See release-package.yml's own comment on this exact step -- same
        # apt-get flakiness history, same fix (skip entirely when already
        # present, which is the common case on this runner image).
        timeout-minutes: 8
        run: |
          MISSING=""
          for bin in rsync unzip zip; do
            command -v "$bin" >/dev/null 2>&1 || MISSING="$MISSING $bin"
          done

          if [ -z "$MISSING" ]; then
            echo "rsync, unzip, and zip are already present on this runner -- nothing to install."
            exit 0
          fi

          echo "Installing missing packaging tools:$MISSING"
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS $MISSING

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Resolve plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP' > /tmp/plugin-version.env
          <?php
          $plugin = file_get_contents('security-automation-manager.php');
          preg_match('/^\s*\*\s+Version:\s*([^\r\n]+)/mi', $plugin, $m);
          $version = trim($m[1] ?? 'unknown');
          echo "PLUGIN_VERSION={$version}\n";
          PHP

          # shellcheck disable=SC1091
          source /tmp/plugin-version.env
          echo "version=${PLUGIN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Build GitHub-channel ZIP
        id: build
        shell: bash
        run: |
          set -euo pipefail

          GITHUB_ZIP_FILENAME="security-automation-manager-development-latest.zip"

          rm -rf dist
          mkdir -p dist/github/security-automation-manager

          rsync -a --delete --exclude-from='.distignore' ./ dist/github/security-automation-manager/

          cat > dist/github/security-automation-manager/includes/build-channel.php <<'PHP'
          <?php
          /**
           * Generated build-channel marker for the GitHub-channel ZIP.
           */

          declare( strict_types=1 );

          if ( ! defined( 'ABSPATH' ) ) {
            exit;
          }

          if ( ! defined( 'WP_SAM_DISTRIBUTION_CHANNEL' ) ) {
            define( 'WP_SAM_DISTRIBUTION_CHANNEL', 'github' );
          }
          PHP

          python3 - <<'PY'
          from pathlib import Path
          plugin = Path("dist/github/security-automation-manager/security-automation-manager.php")
          contents = plugin.read_text()
          marker = " * Plugin URI:        https://github.com/vcns/security-automation-manager\n"
          update = " * Update URI:        https://github.com/vcns/security-automation-manager\n"
          if update not in contents:
              contents = contents.replace(marker, marker + update, 1)
          plugin.write_text(contents)
          PY

          COMMIT_TIMESTAMP="$(git log -1 --format=%ct)"
          find dist/github/security-automation-manager -exec touch -h -d "@${COMMIT_TIMESTAMP}" {} +

          ( cd dist/github && find security-automation-manager -type f -print | LC_ALL=C sort | zip -q -X "../${GITHUB_ZIP_FILENAME}" -@ )

          echo "zip_filename=${GITHUB_ZIP_FILENAME}" >> "${GITHUB_OUTPUT}"

      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          ZIP="dist/${{ steps.build.outputs.zip_filename }}"

          unzip -l "${ZIP}" | grep -q 'security-automation-manager/security-automation-manager.php'
          unzip -l "${ZIP}" | grep -q 'security-automation-manager/includes/modules/class-github-update-checker.php'
          unzip -l "${ZIP}" | grep -q 'security-automation-manager/includes/build-channel.php'
          unzip -p "${ZIP}" security-automation-manager/security-automation-manager.php | grep -q 'Update URI:'

          if unzip -l "${ZIP}" | grep -E 'security-automation-manager/(\.git|\.github|\.private_key|\.public_key|\.phpunit\.cache|cloudflare|docs|node_modules|offline|test|tools|vendor)/'; then
            echo "Development ZIP contains development-only or generated paths. Check .distignore." >&2
            exit 1
          fi

      - name: Move the development-latest tag to this commit
        run: |
          set -euo pipefail
          git tag -f development-latest
          git push origin development-latest --force

      - name: Publish or update the development-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="dist/${{ steps.build.outputs.zip_filename }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHORT_SHA="${{ steps.version.outputs.short_sha }}"
          BUILT_AT="$(date -u +"%Y-%m-%d %H:%M UTC")"

          NOTES="Automatically updated build of the \`development\` branch -- **not** a stable, numbered release.

          - Plugin version at build time: ${VERSION}
          - Commit: ${GITHUB_SHA}
          - Built: ${BUILT_AT}

          Install via wp-admin > Plugins > Add New > Upload Plugin, on a test site only. This ZIP includes the same self-updating mechanism a real release ships; it will not interfere with a real numbered release's own update checks either way, since the update checker only ever offers a version newer than what's currently installed."

          publish() {
            if gh release view development-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload development-latest "${ZIP}" --repo "${GITHUB_REPOSITORY}" --clobber
              gh release edit development-latest --repo "${GITHUB_REPOSITORY}" \
                --title "Development build (auto-updated, ${VERSION}-${SHORT_SHA})" \
                --notes "${NOTES}" --prerelease
            else
              gh release create development-latest "${ZIP}" --repo "${GITHUB_REPOSITORY}" \
                --title "Development build (auto-updated, ${VERSION}-${SHORT_SHA})" \
                --notes "${NOTES}" --prerelease --target "${GITHUB_SHA}"
            fi
          }

          # Same transient-5xx hardening release-package.yml already uses.
          for delay in 0 15 30 60; do
            sleep "${delay}"
            if publish; then
              exit 0
            fi
            echo "::warning::Development release publish attempt failed; retrying in a moment."
          done

          echo "::error::Development release publish failed after all retries."
          exit 1
