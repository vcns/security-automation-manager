name: PR Branch Policy

# Two-stage flow, formalised now that the product is moving from MVP into a
# real commercial release cadence: chore/codex/docs/feature/fix/hotfix work
# lands in `development` first; only `release/*` (a version-bump branch cut
# from development, per docs/release-and-publishing.md) or `hotfix/*` (a
# genuine emergency fix that can't wait for the normal cycle) may go
# straight to `main`. `development` had gone unused for months while this
# was still an MVP with no real staging need -- see docs/consolidation-
# ledger.md and the git history around 2026-07 for that period -- and has
# been reset to match `main` as of this policy taking effect, rather than
# merging its old, superseded pre-rebrand commits forward.
#
# codex/* is deliberately NOT in either allowlist: the team does not want
# that branch pattern treated as a first-class source for any target.
on:
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce-source-branch-policy:
    name: Enforce PR Source Branch Policy
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch for development
        if: github.base_ref == 'development'
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$ACTOR" == "dependabot[bot]" && "$HEAD_REF" =~ ^dependabot/ ]]; then
            exit 0
          fi
          if [[ ! "$HEAD_REF" =~ ^chore/ && ! "$HEAD_REF" =~ ^docs/ && ! "$HEAD_REF" =~ ^feature/ && ! "$HEAD_REF" =~ ^fix/ && ! "$HEAD_REF" =~ ^hotfix/ && ! "$HEAD_REF" =~ ^release/ ]]; then
            echo "Pull requests into development must come from chore/*, docs/*, feature/*, fix/*, hotfix/*, or release/* branches. Got: $HEAD_REF"
            exit 1
          fi

      - name: Validate source branch for main
        if: github.base_ref == 'main'
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$ACTOR" == "dependabot[bot]" && "$HEAD_REF" =~ ^dependabot/ ]]; then
            exit 0
          fi
          if [[ ! "$HEAD_REF" =~ ^development$ && ! "$HEAD_REF" =~ ^release/ && ! "$HEAD_REF" =~ ^hotfix/ ]]; then
            echo "Pull requests into main must come from development, release/*, or hotfix/* branches. Got: $HEAD_REF"
            exit 1
          fi
