name: Release Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - development
      - main
    paths:
      - '.distignore'
      - '.github/workflows/release-package.yml'
      - 'assets/**'
      - 'composer.json'
      - 'composer.lock'
      - 'includes/**'
      - 'LICENSE'
      - 'readme.txt'
      - 'tools/lint-php.php'
      - 'uninstall.php'
      - 'security-automation-manager.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build release ZIP
    runs-on: ubuntu-latest

    outputs:
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      version: ${{ steps.release_meta.outputs.version }}
      zip_filename: ${{ steps.build.outputs.zip_filename }}
      github_zip_filename: ${{ steps.build.outputs.github_zip_filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install packaging tools
        # rsync/unzip/zip are already preinstalled on GitHub's ubuntu-latest
        # runner image in the overwhelming common case -- skip apt entirely
        # when so, which is also the fix: apt-get against this runner pool
        # has repeatedly hung for minutes to hours (confirmed in production
        # across v2.9.8 and v2.9.12) on a flaky azure.archive.ubuntu.com
        # mirror, and per-request retry/timeout flags alone did not
        # reliably bound it -- apt-get update fell back to a working
        # mirror in seconds each time, but apt-get install then hung
        # silently downloading package files for minutes with no log
        # output at all, past even an 8-minute Acquire::Timeout-guarded
        # ceiling. Only touches the network at all if a tool is genuinely
        # missing, and only installs what's actually missing.
        timeout-minutes: 8
        run: |
          MISSING=""
          for bin in rsync unzip zip; do
            command -v "$bin" >/dev/null 2>&1 || MISSING="$MISSING $bin"
          done

          if [ -z "$MISSING" ]; then
            echo "rsync, unzip, and zip are already present on this runner -- nothing to install."
            exit 0
          fi

          echo "Installing missing packaging tools:$MISSING"
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          sudo apt-get update $APT_OPTS
          sudo apt-get install -y $APT_OPTS $MISSING

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax lint
        run: composer run lint:php

      - name: PHPCS
        run: composer run lint:phpcs -- --report=full

      - name: PHPUnit
        run: composer run test:no-coverage

      - name: Composer audit
        run: composer audit

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP' > /tmp/plugin-version.env
          <?php
          $plugin = file_get_contents('security-automation-manager.php');
          if (false === $plugin) {
              fwrite(STDERR, "Unable to read security-automation-manager.php\n");
              exit(1);
          }

          preg_match('/^\s*\*\s+Version:\s*([^\r\n]+)/mi', $plugin, $header_matches);
          preg_match("/define\(\s*'WP_SAM_VERSION'\s*,\s*'([^']+)'\s*\)/", $plugin, $constant_matches);

          $header_version = trim($header_matches[1] ?? '');
          $constant_version = trim($constant_matches[1] ?? '');

          if ('' === $header_version || $header_version !== $constant_version) {
              fwrite(STDERR, "Plugin header Version and WP_SAM_VERSION must match.\n");
              fwrite(STDERR, "Header: {$header_version}\n");
              fwrite(STDERR, "Constant: {$constant_version}\n");
              exit(1);
          }

          if (is_readable('readme.txt')) {
              $readme = file_get_contents('readme.txt');
              preg_match('/^Stable tag:\s*([^\r\n]+)/mi', (string) $readme, $stable_matches);
              $stable_tag = trim($stable_matches[1] ?? '');
              if ('' !== $stable_tag && $stable_tag !== $header_version) {
                  fwrite(STDERR, "readme.txt Stable tag must match plugin version {$header_version}.\n");
                  fwrite(STDERR, "Stable tag: {$stable_tag}\n");
                  exit(1);
              }
          }

          echo "PLUGIN_VERSION={$header_version}\n";
          PHP

          # shellcheck disable=SC1091
          source /tmp/plugin-version.env

          REF="${GITHUB_REF:-}"
          TAG="${GITHUB_REF_NAME:-}"
          IS_PRERELEASE=false

          if [[ "${REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${TAG#v}"
            if [[ "${TAG_VERSION}" != "${PLUGIN_VERSION}" ]]; then
              echo "Release tag ${TAG} must match plugin version ${PLUGIN_VERSION}." >&2
              exit 1
            fi
            if [[ "${TAG}" == *"-"* ]]; then
              IS_PRERELEASE=true
            fi
          else
            TAG="dev-${GITHUB_SHA::12}"
          fi

          echo "version=${PLUGIN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"

      # Proves the checker itself actually rejects a violation (not just
      # that it passes already-clean input, which a checker that always
      # exits 0 would also do) before the build below ever relies on it.
      - name: Self-test the WordPress.org package verifier
        shell: bash
        run: bash .github/scripts/test-verify-wporg-package.sh

      - name: Build release ZIP
        id: build
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.release_meta.outputs.version }}"
          TAG="${{ steps.release_meta.outputs.tag }}"
          # ZIP_FILENAME is the eventual public GitHub Release asset name
          # only (see the release job below, which copies GITHUB_ZIP's
          # content to this name) -- it has never described the WordPress.org
          # review ZIP's own folder/file name, so it is untouched by the
          # slug rename below and stays what GitHub-channel installs/update
          # feeds already expect.
          ZIP_FILENAME="security-automation-manager-${TAG}.zip"
          # WordPress.org requires the plugin's root folder name to match
          # its registered slug (vcns-security-automation-manager, pending
          # approval) -- WordPress uses that folder name to identify the
          # installed plugin, so this must not stay the pre-rename name.
          WPORG_ZIP_FILENAME="vcns-security-automation-manager-${TAG}.zip"
          GITHUB_ZIP_FILENAME="security-automation-manager-github-${TAG}.zip"

          rm -rf dist
          mkdir -p dist/wporg/vcns-security-automation-manager dist/github/security-automation-manager

          rsync -a --delete --exclude-from='.distignore' ./ dist/wporg/vcns-security-automation-manager/
          rsync -a --delete --exclude-from='.distignore' ./ dist/github/security-automation-manager/

          rm -f dist/wporg/vcns-security-automation-manager/includes/modules/class-github-update-checker.php
          rm -rf dist/wporg/vcns-security-automation-manager/includes/extensions

          cat > dist/github/security-automation-manager/includes/build-channel.php <<'PHP'
          <?php
          /**
           * Generated build-channel marker for the GitHub release ZIP.
           */

          declare( strict_types=1 );

          if ( ! defined( 'ABSPATH' ) ) {
            exit;
          }

          if ( ! defined( 'WP_SAM_DISTRIBUTION_CHANNEL' ) ) {
            define( 'WP_SAM_DISTRIBUTION_CHANNEL', 'github' );
          }
          PHP

          python3 - <<'PY'
          from pathlib import Path
          plugin = Path("dist/github/security-automation-manager/security-automation-manager.php")
          contents = plugin.read_text()
          marker = " * Plugin URI:        https://github.com/vcns/security-automation-manager\n"
          update = " * Update URI:        https://github.com/vcns/security-automation-manager\n"
          if update not in contents:
              contents = contents.replace(marker, marker + update, 1)
          plugin.write_text(contents)
          PY

          COMMIT_TIMESTAMP="$(git log -1 --format=%ct)"
          find dist/wporg/vcns-security-automation-manager dist/github/security-automation-manager -exec touch -h -d "@${COMMIT_TIMESTAMP}" {} +

          ( cd dist/wporg && find vcns-security-automation-manager -type f -print | LC_ALL=C sort | zip -q -X "../${WPORG_ZIP_FILENAME}" -@ )
          ( cd dist/github && find security-automation-manager -type f -print | LC_ALL=C sort | zip -q -X "../${GITHUB_ZIP_FILENAME}" -@ )

          echo "zip_filename=${ZIP_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "wporg_zip_filename=${WPORG_ZIP_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "github_zip_filename=${GITHUB_ZIP_FILENAME}" >> "${GITHUB_OUTPUT}"

      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          WPORG_ZIP="dist/${{ steps.build.outputs.wporg_zip_filename }}"
          GITHUB_ZIP="dist/${{ steps.build.outputs.github_zip_filename }}"

          unzip -l "${WPORG_ZIP}" | grep -q 'vcns-security-automation-manager/security-automation-manager.php'
          unzip -l "${WPORG_ZIP}" | grep -q 'vcns-security-automation-manager/uninstall.php'
          unzip -l "${WPORG_ZIP}" | grep -q 'vcns-security-automation-manager/languages/index.php'

          unzip -l "${GITHUB_ZIP}" | grep -q 'security-automation-manager/security-automation-manager.php'
          unzip -l "${GITHUB_ZIP}" | grep -q 'security-automation-manager/uninstall.php'
          unzip -l "${GITHUB_ZIP}" | grep -q 'security-automation-manager/languages/index.php'

          if unzip -l "${WPORG_ZIP}" | grep -E 'class-github-update-checker\.php|includes/build-channel\.php'; then
            echo "WordPress.org ZIP contains GitHub-channel updater files." >&2
            exit 1
          fi
          if unzip -p "${WPORG_ZIP}" vcns-security-automation-manager/security-automation-manager.php | grep -q 'Update URI:'; then
            echo "WordPress.org ZIP must not include the GitHub Update URI header." >&2
            exit 1
          fi
          unzip -l "${GITHUB_ZIP}" | grep -q 'security-automation-manager/includes/modules/class-github-update-checker.php'
          unzip -l "${GITHUB_ZIP}" | grep -q 'security-automation-manager/includes/build-channel.php'
          unzip -p "${GITHUB_ZIP}" security-automation-manager/security-automation-manager.php | grep -q 'Update URI:'

          if unzip -l "${WPORG_ZIP}" | grep -q 'vcns-security-automation-manager/includes/extensions/'; then
            echo "WordPress.org ZIP contains includes/extensions/ -- must be physically absent, not merely unloaded." >&2
            exit 1
          fi

      - name: Verify WordPress.org package contains no paid-mode identifiers
        shell: bash
        run: |
          set -euo pipefail

          WPORG_ZIP="dist/${{ steps.build.outputs.wporg_zip_filename }}"
          GITHUB_ZIP="dist/${{ steps.build.outputs.github_zip_filename }}"

          rm -rf /tmp/wporg-package-check
          mkdir -p /tmp/wporg-package-check
          unzip -q "${WPORG_ZIP}" -d /tmp/wporg-package-check
          bash .github/scripts/verify-wporg-package.sh /tmp/wporg-package-check/vcns-security-automation-manager

          if unzip -l "${WPORG_ZIP}" | grep -E 'vcns-security-automation-manager/(\.git|\.github|\.private_key|\.public_key|\.phpunit\.cache|cloudflare|docs|node_modules|offline|test|tools|vendor)/|vcns-security-automation-manager/(\.distignore|\.git|code-review-findings\.json|COMMERCIAL_TERMS\.md|README\.md|RESEARCH\.md|SPECIFICATION\.md|TRADEMARK_POLICY\.md)$'; then
            echo "WordPress.org ZIP contains development, private, documentation, or generated-only paths. Check .distignore." >&2
            exit 1
          fi
          if unzip -l "${GITHUB_ZIP}" | grep -E 'security-automation-manager/(\.git|\.github|\.private_key|\.public_key|\.phpunit\.cache|cloudflare|docs|node_modules|offline|test|tools|vendor)/|security-automation-manager/(\.distignore|\.git|code-review-findings\.json|COMMERCIAL_TERMS\.md|README\.md|RESEARCH\.md|SPECIFICATION\.md|TRADEMARK_POLICY\.md)$'; then
            echo "GitHub-channel ZIP contains development, private, documentation, or generated-only paths. Check .distignore." >&2
            exit 1
          fi

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: security-automation-manager-release-zip
          path: dist/*.zip
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: security-automation-manager-release-zip
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ZIP_FILENAME="${{ needs.build.outputs.zip_filename }}"
          GITHUB_ZIP_FILENAME="${{ needs.build.outputs.github_zip_filename }}"

          PRERELEASE_FLAG=""
          if [[ "${{ needs.build.outputs.is_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # GitHub's API returns transient 5xx errors often enough (a full
          # outage burned two release attempts for v2.6.0) that a publish
          # step without retries is a reliability bug. Exponential-ish
          # backoff, ~6 minutes worst case, before declaring a real failure.
          # Exactly ONE release asset: security-automation-manager-vX.Y.Z.zip,
          # containing the GITHUB-channel build (self-updater included) --
          # GitHub Releases ARE the GitHub distribution channel. The
          # wporg-channel package (updater stripped for directory-guideline
          # compliance) stays a CI artifact for the WordPress.org SVN
          # pipeline and is never a release download: publishing it here is
          # exactly how a site silently loses its update mechanism.
          rm -f "dist/${ZIP_FILENAME}"
          cp "dist/${GITHUB_ZIP_FILENAME}" "dist/${ZIP_FILENAME}"

          publish() {
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${TAG}" "dist/${ZIP_FILENAME}" --repo "${GITHUB_REPOSITORY}" --clobber
            else
              gh release create "${TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "Security Automation Manager ${TAG}" \
                --generate-notes \
                --notes "Install or update with \`security-automation-manager-${TAG}.zip\` (the self-updating GitHub-channel build). Tip: when installing via wp-cli from a URL, rename the extracted folder to \`security-automation-manager\` if it comes out versioned; wp-admin uploads extract to the correct folder automatically." \
                ${PRERELEASE_FLAG} \
                "dist/${ZIP_FILENAME}"
            fi
          }

          for delay in 0 15 30 60 120 180; do
            sleep "${delay}"
            if publish; then
              exit 0
            fi
            echo "::warning::Release publish attempt failed; retrying in a moment."
          done

          echo "::error::Release publish failed after all retries."
          exit 1

  update-feed:
    name: Publish GitHub-channel update feed
    needs:
      - build
      - release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.is_prerelease == 'false'

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: security-automation-manager-release-zip
          path: dist/

      - name: Prepare update feed
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          GITHUB_ZIP_FILENAME="${{ needs.build.outputs.github_zip_filename }}"
          FEED_DIR="/tmp/pages"
          LAST_UPDATED="$(date -u +%Y-%m-%d)"

          # vcns/wp-updates is a stateless overwrite feed, not an archive: its own
          # TEMPLATE/ convention (see that repo's README) publishes exactly one
          # <slug>-latest.zip per product, overwritten on every release -- no
          # per-version copies kept there (those already exist as GitHub Release
          # assets on this repo). Matching that filename exactly (no "-github-"
          # infix, needed on the Release page to disambiguate from the
          # WordPress.org-channel asset, but redundant here since this feed only
          # ever serves the GitHub channel) is what lets this product's folder
          # look like every other product onboarded via that TEMPLATE.
          LATEST_ZIP_FILENAME="security-automation-manager-latest.zip"

          mkdir -p "${FEED_DIR}"
          cp "dist/${GITHUB_ZIP_FILENAME}" "${FEED_DIR}/${LATEST_ZIP_FILENAME}"
          SHA256="$(sha256sum "${FEED_DIR}/${LATEST_ZIP_FILENAME}" | awk '{print $1}')"

          python3 - <<PY
          import json
          version = "${VERSION}"
          last_updated = "${LAST_UPDATED}"
          zip_name = "${LATEST_ZIP_FILENAME}"
          sha256 = "${SHA256}"
          update_url = "https://vcns.github.io/wp-updates/security-automation-manager/" + zip_name
          data = {
              "name": "Security Automation Manager",
              "slug": "security-automation-manager",
              "version": version,
              "author": "VCNS Tech Ltd",
              "author_homepage": "https://vcns.tech",
              "requires": "6.4",
              "tested": "7.0",
              "requires_php": "8.1",
              "download_url": update_url,
              "sha256": sha256,
              "last_updated": last_updated,
              "homepage": "https://github.com/vcns/security-automation-manager",
              "sections": {
                  "description": "Strict HTTP security header rollout, reporting, and decision review for WordPress.",
                  "changelog": "See https://github.com/vcns/security-automation-manager/releases/tag/${TAG}"
              }
          }
          with open("${FEED_DIR}/update.json", "w", encoding="utf-8") as handle:
              json.dump(data, handle, indent=2)
          # Mirrors vcns/wp-updates' own TEMPLATE/index.html styling, so this
          # product's page looks like every other one onboarded via that
          # template rather than a one-off.
          html = f"""<!doctype html>
          <html lang='en'>
          <head>
            <meta charset='UTF-8'>
            <meta name='viewport' content='width=device-width,initial-scale=1'>
            <title>Security Automation Manager Updates</title>
            <style>
              body{{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#333;line-height:1.6}}
              h1{{color:#2D2C94;margin-bottom:4px}}
              .meta{{color:#555;margin-bottom:24px}}
              a{{color:#2D2C94}}
              code{{background:#f5f5f5;padding:2px 6px;border-radius:4px;font-size:.9em;word-break:break-all}}
              .btn{{display:inline-block;background:#2D2C94;color:#fff;padding:9px 20px;border-radius:6px;text-decoration:none;margin-right:8px;font-weight:600}}
              hr{{margin:32px 0;border:none;border-top:1px solid #eee}}
            </style>
          </head>
          <body>
            <p><a href='../'>&larr; All products</a></p>
            <h1>Security Automation Manager</h1>
            <p class='meta'>Latest: <strong>{version}</strong> &mdash; {last_updated}</p>
            <p>
              <a class='btn' href='{zip_name}'>Download ZIP</a>
              <a href='update.json'>update.json</a>
            </p>
            <hr>
            <p>WordPress update endpoint for <strong>Security Automation Manager</strong> (GitHub-channel installs only).</p>
            <p>Update URL: <code>{update_url}</code></p>
          </body>
          </html>
          """
          with open("${FEED_DIR}/index.html", "w", encoding="utf-8") as handle:
              handle.write(html)
          PY

      - name: Deploy to vcns/wp-updates
        env:
          WP_UPDATES_TOKEN: ${{ secrets.WP_UPDATES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${WP_UPDATES_TOKEN:-}" ]]; then
            echo "::warning::Missing WP_UPDATES_TOKEN secret. Release ZIPs were published, but the GitHub-channel update feed was not updated."
            exit 0
          fi

          UPDATE_REPO="vcns/wp-updates"
          WORKTREE="/tmp/wp-updates"
          REMOTE_URL="https://x-access-token:${WP_UPDATES_TOKEN}@github.com/${UPDATE_REPO}.git"

          if git ls-remote --exit-code --heads "${REMOTE_URL}" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "${REMOTE_URL}" "${WORKTREE}"
          else
            mkdir -p "${WORKTREE}"
            git -C "${WORKTREE}" init --initial-branch=gh-pages
            git -C "${WORKTREE}" remote add origin "${REMOTE_URL}"
          fi

          mkdir -p "${WORKTREE}/security-automation-manager"
          cp -R /tmp/pages/. "${WORKTREE}/security-automation-manager/"

          git -C "${WORKTREE}" config user.name "github-actions[bot]"
          git -C "${WORKTREE}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${WORKTREE}" add security-automation-manager

          if git -C "${WORKTREE}" diff --cached --quiet; then
            echo "No update feed changes to publish."
            exit 0
          fi

          git -C "${WORKTREE}" commit -m "security-automation-manager ${GITHUB_REF_NAME}"

          # Same transient-5xx hardening as the release-publish step.
          for delay in 0 15 30 60 120; do
            sleep "${delay}"
            if git -C "${WORKTREE}" push origin gh-pages; then
              exit 0
            fi
            echo "::warning::Update-feed push failed; retrying in a moment."
          done

          echo "::error::Update-feed push failed after all retries."
          exit 1
