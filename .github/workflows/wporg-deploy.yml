name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'GitHub environment providing WordPress.org deploy credentials'
        required: true
        default: production
        type: choice
        options:
          - development
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Plugin to WordPress.org SVN
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The SVN repository only exists once WordPress.org approves the plugin
      # submission. Until then every tag push would fail red (E170000) and
      # bury real failures in noise -- so check first and skip gracefully,
      # keeping the automatic deploy armed for the day the slug goes live.
      - name: Check WordPress.org SVN repository exists
        id: svn_check
        shell: bash
        run: |
          set -euo pipefail
          if svn info "https://plugins.svn.wordpress.org/security-automation-manager" --non-interactive > /dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::WordPress.org SVN repository for 'security-automation-manager' does not exist yet (plugin review pending?). Skipping SVN deploy; GitHub Release and update feed are unaffected."
          fi

      # release-package.yml's rsync-based build strips this file from its
      # WordPress.org-channel ZIP via an explicit rm (it can't just add it to
      # .distignore -- that file is shared with the GitHub-channel build,
      # which needs to keep it). This deploy checks out the raw tagged tree
      # instead and has no equivalent step of its own, so without this the
      # self-updater would reach WordPress.org SVN and fail the exact same
      # "Plugin Updater detected" automated-scan rejection a manual
      # first-time submission hit. Deleting it from this ephemeral runner
      # checkout only -- it never touches the actual repository.
      - name: Strip GitHub-channel self-updater before SVN deploy
        if: steps.svn_check.outputs.exists == 'true'
        run: rm -f includes/modules/class-github-update-checker.php

      - name: Deploy to WordPress.org SVN
        if: steps.svn_check.outputs.exists == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ vars.SVC_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: security-automation-manager
