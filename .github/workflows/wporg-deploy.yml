name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'GitHub environment providing WordPress.org deploy credentials'
        required: true
        default: production
        type: choice
        options:
          - development
          - production

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    name: Deploy Plugin to WordPress.org SVN
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'production' }}

    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # WordPress.org human-reviews every SVN submission -- this must never
      # fire from an untracked commit. Requires the tagged commit to be the
      # merge commit of an actual pull request from release/v<version> into
      # main (not a direct push to main, and not any other branch name).
      # Deliberately a hard failure (not a graceful skip like the two checks
      # below) -- an untracked-provenance deploy attempt is a policy
      # violation worth a loud red X, not a quiet no-op. Applies to
      # workflow_dispatch too: dispatching against a plain branch (default
      # 'main') computes an expected branch of "release/main", which will
      # never exist, so it fails the same way a bad manual dispatch should.
      - name: Verify release came from an approved release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${TAG}' is not a plugin version tag (expected vX.Y.Z). The WordPress.org SVN deploy only runs for a proper version tag."
            exit 1
          fi

          EXPECTED_BRANCH="release/${TAG}"
          MATCH_COUNT="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              | jq --arg branch "${EXPECTED_BRANCH}" \
                '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == $branch)] | length'
          )"

          if [ "${MATCH_COUNT}" -lt 1 ]; then
            echo "::error::No merged pull request from '${EXPECTED_BRANCH}' into 'main' was found for commit ${GITHUB_SHA}. The WordPress.org SVN deploy only runs for a release merged through that exact branch via a pull request -- re-tag after merging ${EXPECTED_BRANCH} into main, not after a direct push."
            exit 1
          fi

          echo "Verified: ${TAG} was merged into main via a pull request from ${EXPECTED_BRANCH}."

      # ubuntu-latest runners don't ship the svn CLI by default (unlike git).
      # Without this, `svn info` below fails instantly with "command not
      # found", which the `> /dev/null 2>&1` guard silently swallows -- every
      # run then misreports "repository doesn't exist yet" regardless of
      # actual approval/provisioning status, which is exactly what happened
      # here after the plugin was genuinely approved and provisioned.
      - name: Install Subversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion
          svn --version --quiet

      # The SVN repository only exists once WordPress.org approves the plugin
      # submission. Until then every tag push would fail red (E170000) and
      # bury real failures in noise -- so check first and skip gracefully,
      # keeping the automatic deploy armed for the day the slug goes live.
      - name: Check WordPress.org SVN repository exists
        id: svn_check
        shell: bash
        run: |
          set -euo pipefail
          if svn info "https://plugins.svn.wordpress.org/vcns-security-automation-manager" --non-interactive > /dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::WordPress.org SVN repository for 'vcns-security-automation-manager' does not exist yet (plugin review pending?). Skipping SVN deploy; GitHub Release and update feed are unaffected."
          fi

      # WordPress.org reviews every submission by hand and does not allow
      # more than one per day. The live SVN log is the authoritative record
      # of when a deploy last actually happened -- no separate state file to
      # keep in sync. A graceful skip (like the repo-existence check above),
      # not a hard failure: tagging twice in a day isn't a mistake worth a
      # red X, it just means this one waits.
      - name: Enforce WordPress.org's one-submission-per-day limit
        id: rate_limit
        if: steps.svn_check.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LAST_COMMIT_DATE="$(
            svn log -l 1 "https://plugins.svn.wordpress.org/vcns-security-automation-manager" --non-interactive 2>/dev/null \
              | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}' | head -1 || true
          )"

          if [ -z "${LAST_COMMIT_DATE}" ]; then
            echo "Could not determine the last SVN commit date -- nothing to rate-limit against yet."
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          LAST_EPOCH="$(date -u -d "${LAST_COMMIT_DATE}" +%s)"
          NOW_EPOCH="$(date -u +%s)"
          ELAPSED_HOURS=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))

          if [ "${ELAPSED_HOURS}" -lt 24 ]; then
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Skipping WordPress.org SVN deploy: the last submission was ${ELAPSED_HOURS}h ago (${LAST_COMMIT_DATE} UTC). WordPress.org reviews submissions by hand and does not allow more than one per day. GitHub Release and update feed are unaffected -- re-run this workflow (workflow_dispatch) once 24 hours have passed."
          else
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            echo "Last SVN submission was ${ELAPSED_HOURS}h ago -- clear to deploy."
          fi

      # Proves the checker used below actually rejects a forbidden
      # path/identifier, not just that it happens to pass on already-clean
      # input -- see the script's own header for what the four phases check.
      # Runs before this job relies on that checker for a real deploy
      # decision.
      - name: Self-test the WordPress.org package verifier
        if: steps.svn_check.outputs.exists == 'true'
        shell: bash
        run: bash .github/scripts/test-verify-wporg-package.sh

      # release-package.yml's rsync-based build strips these from its
      # WordPress.org-channel ZIP via explicit removal (neither can just go
      # in .distignore -- that file is shared with the GitHub-channel build,
      # which needs to keep both: the self-updater, and any paid automation
      # mode an extension in includes/extensions/ registers). This deploy
      # checks out the raw tagged tree instead and has no equivalent step of
      # its own, so without this the self-updater would reach WordPress.org
      # SVN and fail the same "Plugin Updater detected" automated-scan
      # rejection a manual first-time submission hit, and any paid-mode
      # extension would ship live restricted functionality. Deleting from
      # this ephemeral runner checkout only -- it never touches the actual
      # repository.
      - name: Strip GitHub-channel-only content before SVN deploy
        if: steps.svn_check.outputs.exists == 'true'
        run: |
          rm -f includes/modules/class-github-update-checker.php
          rm -rf includes/extensions

      # Verifies against a .distignore-filtered copy, not the raw checkout --
      # the raw tree still contains docs/, test/, and other paths that
      # legitimately mention these identifiers for documentation purposes
      # but never reach the actual SVN payload (the 10up action below
      # applies the same .distignore filtering internally). This mirrors
      # release-package.yml's own build step exactly, so both paths that can
      # produce a WordPress.org-bound package are checked the same way.
      - name: Verify WordPress.org package contains no paid-mode identifiers
        if: steps.svn_check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/wporg-deploy-check
          mkdir -p /tmp/wporg-deploy-check
          rsync -a --exclude-from='.distignore' ./ /tmp/wporg-deploy-check/
          bash .github/scripts/verify-wporg-package.sh /tmp/wporg-deploy-check

      # One-time cleanup, safe to leave in permanently: a since-fixed
      # ASSETS_DIR path mistake put a build zip and an internal draft file
      # (accidentally committed to git in an unrelated commit, since
      # untracked and .gitignore'd) live and public on the real SVN
      # listing, at assets/assets/, assets/<zip>, and assets/<draft>.md.
      # Existence-checked per path so this becomes a no-op forever once
      # they're actually gone, rather than failing every future deploy.
      - name: Remove stray pre-fix files from the live SVN listing
        if: steps.svn_check.outputs.exists == 'true' && steps.rate_limit.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://plugins.svn.wordpress.org/vcns-security-automation-manager/assets"
          STALE_PATHS=(
            "${BASE}/assets"
            "${BASE}/vcns-security-automation-manager-v2.9.24.zip"
            "${BASE}/wporg-resubmission-reply-draft.md"
          )
          TO_DELETE=()
          for p in "${STALE_PATHS[@]}"; do
            if svn info "$p" --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive --no-auth-cache > /dev/null 2>&1; then
              TO_DELETE+=("$p")
            fi
          done
          if [ "${#TO_DELETE[@]}" -eq 0 ]; then
            echo "Nothing stale to remove."
          else
            svn delete "${TO_DELETE[@]}" \
              -m "Remove files accidentally committed to git and deployed pre-fix (build zip, internal draft, and a wrongly-nested assets/assets/ path)" \
              --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}" --non-interactive --no-auth-cache
          fi
        env:
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Deploy to WordPress.org SVN
        if: steps.svn_check.outputs.exists == 'true' && steps.rate_limit.outputs.ok == 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable, 2025-01-21
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: vcns-security-automation-manager
