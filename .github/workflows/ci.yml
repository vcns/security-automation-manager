name: CI

# push is intentionally scoped to development/main only, not every working
# branch pattern (codex/**, feature/**, fix/**, release/**) -- pr-branch-
# policy.yml already requires every one of those to land via a PR into
# development or main, so the pull_request trigger below covers them. Once a
# PR is open, a push to its head branch fires BOTH a `push` and a
# `pull_request: synchronize` event for the identical commit; keeping those
# branch patterns here made this entire workflow (a 4-way PHPUnit matrix,
# Secret Scan, Semgrep, and the release-artifact build) run twice per push.
# push on development/main themselves is kept as a post-merge trunk health
# check -- those refs can never simultaneously be a PR head into themselves.
on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read
  security-events: write

jobs:
  php-lint-and-standards:
    name: PHP Lint, PHPCS, and PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the plugin's declared minimum (security-automation-manager.php
        # "Requires PHP"); 8.2-8.4 are the later supported releases per
        # docs/testing-requirements.md's CI matrix requirement. PHPCS/lint
        # only need to pass once -- restricted to the minimum version so a
        # style violation reports once, not once per PHP version.
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: |
            ~/.composer/cache/files
            vendor
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax lint
        run: composer run lint:php

      - name: PHPCS
        if: matrix.php-version == '8.1'
        run: composer run lint:phpcs -- --report=full

      - name: PHPUnit
        run: composer run test:no-coverage

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Semgrep scan
        run: semgrep scan --config p/php --config p/owasp-top-ten --config p/secrets

  package-audit:
    name: Build Release Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build distribution zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/security-automation-manager
          rsync -av ./ dist/security-automation-manager/ --exclude-from='.distignore'
          cd dist
          zip -r security-automation-manager.zip security-automation-manager

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: security-automation-manager-dist
          path: dist/security-automation-manager.zip
